<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.75em;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            margin-bottom: 24px;
            background: white;
        }

        .upload-area:hover {
            border-color: #999;
            background: #f5f5f5;
        }

        .upload-area.dragover {
            border-color: #333;
            background: #f5f5f5;
        }

        .upload-icon {
            font-size: 2em;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .upload-text {
            color: #666;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-bottom: 24px;
        }

        .preview-container.active {
            display: block;
        }

        #preview {
            max-width: 100%;
            max-height: 360px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            background: #eee;
        }

        .btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
            margin-bottom: 24px;
        }

        .btn:hover:not(:disabled) {
            background: #333;
        }

        .btn:disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .main-emotion {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 32px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
        }

        .main-emotion-label {
            font-size: 0.85em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .main-emotion-value {
            font-size: 2.25em;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: -0.02em;
        }

        .confidence {
            font-size: 1em;
            color: #666;
            margin-top: 8px;
        }

        .all-probabilities {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 24px;
            border-radius: 8px;
        }

        .all-probabilities h3 {
            font-size: 0.85em;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        .probability-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .probability-item:last-child {
            margin-bottom: 0;
        }

        .probability-label {
            width: 90px;
            color: #555;
            text-transform: capitalize;
        }

        .probability-bar {
            flex: 1;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 12px;
        }

        .probability-fill {
            height: 100%;
            background: #1a1a1a;
            transition: width 0.4s ease;
        }

        .probability-value {
            width: 50px;
            text-align: right;
            color: #333;
            font-variant-numeric: tabular-nums;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 32px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 2px solid #eee;
            border-top: 2px solid #333;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #888;
            font-size: 0.9em;
        }

        .error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Recognition</h1>
        <p class="subtitle">Загрузите фотографию с лицом, чтобы определить эмоцию</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">↑</div>
            <div class="upload-text">Перетащите изображение или нажмите для выбора</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg">
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="preview" alt="Preview">
        </div>

        <button class="btn" id="analyzeBtn" disabled>Анализировать</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Анализ изображения...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="main-emotion">
                <div class="main-emotion-label">Результат</div>
                <div class="main-emotion-value" id="mainEmotion"></div>
                <div class="confidence" id="confidence"></div>
            </div>

            <div class="all-probabilities">
                <h3>Распределение вероятностей</h3>
                <div id="probabilitiesList"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const mainEmotion = document.getElementById('mainEmotion');
        const confidence = document.getElementById('confidence');
        const probabilitiesList = document.getElementById('probabilitiesList');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            if (!file.type.match('image/(jpeg|png|jpg)')) {
                showError('Поддерживаются только форматы JPEG и PNG');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showError('Файл слишком большой. Максимальный размер: 5 МБ');
                return;
            }

            selectedFile = file;
            hideError();

            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                previewContainer.classList.add('active');
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            analyzeBtn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');
            hideError();

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/api/v1/predict/emotion', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Ошибка сервера');
                }

                const data = await response.json();
                displayResults(data);

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('active');
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            mainEmotion.textContent = data.predicted_emotion;
            confidence.textContent = `${(data.confidence * 100).toFixed(1)}% уверенность`;

            const sorted = Object.entries(data.all_probabilities)
                .sort((a, b) => b[1] - a[1]);

            probabilitiesList.innerHTML = sorted.map(([emotion, prob]) => `
                <div class="probability-item">
                    <div class="probability-label">${emotion}</div>
                    <div class="probability-bar">
                        <div class="probability-fill" style="width: ${prob * 100}%"></div>
                    </div>
                    <div class="probability-value">${(prob * 100).toFixed(1)}%</div>
                </div>
            `).join('');

            results.classList.add('active');
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('active');
        }

        function hideError() {
            error.classList.remove('active');
        }
    </script>
</body>
</html>
